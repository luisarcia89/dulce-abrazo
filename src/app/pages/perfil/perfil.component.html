<div class="container my-5" style="max-width: 500px;">

  <h2 class="mb-4">Mi Perfil</h2>

  <div class="card mb-4">
    <div class="card-body">
      <p><strong>Nombre:</strong> {{ nombre }}</p>
      <p><strong>Email:</strong> {{ email }}</p>
    </div>
  </div>

  <h4 class="mb-3">Cambiar Contraseña</h4>

  <form (ngSubmit)="cambiarPassword()">

    <div class="form-group">
      <label>Contraseña actual</label>
      <input type="password" class="form-control" [(ngModel)]="datosPassword.passwordActual" name="passwordActual" required>
    </div>

    <div class="form-group">
      <label>Nueva contraseña</label>
      <input type="password" class="form-control" [(ngModel)]="datosPassword.passwordNueva" name="passwordNueva" required>
    </div>

    <div class="form-group">
      <label>Confirmar nueva contraseña</label>
      <input type="password" class="form-control" [(ngModel)]="datosPassword.confirmarPassword" name="confirmarPassword" required>
    </div>

    <button type="submit" class="btn btn-danger w-100 mt-3">Cambiar Contraseña</button>

  </form>

</div>
