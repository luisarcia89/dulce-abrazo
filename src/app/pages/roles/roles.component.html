<div class="container my-5">

  <h2 class="mb-4">Gestión de Roles</h2>

  <form (ngSubmit)="guardarRol()" class="form-row mb-5">

    <div class="form-group col-md-4">
      <label>Nombre del Rol</label>
      <input type="text" class="form-control" [(ngModel)]="nuevoRol.nombrerol" name="nombrerol" required>
    </div>

    <div class="form-group col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-danger w-100">
        {{ editando ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>

  </form>

  <h3 class="mb-3">Listado de Roles</h3>

  <table class="table table-striped table-bordered">
    <thead class="thead-dark">
      <tr>
        <th>Nombre del Rol</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let rol of roles">
        <td>{{ rol.nombrerol }}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary mr-2" (click)="editarRol(rol)">Editar</button>
          <button class="btn btn-sm btn-outline-danger" (click)="abrirModalEliminar(rol)">Eliminar</button>
        </td>
      </tr>
      <tr *ngIf="roles.length === 0">
        <td colspan="2" class="text-center">No hay roles registrados</td>
      </tr>
    </tbody>
  </table>

</div>


<div class="modal fade" id="modalEliminarRol" tabindex="-1" role="dialog" aria-labelledby="modalEliminarRolLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalEliminarRolLabel">Confirmar eliminación</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" *ngIf="rolAEliminar">
        ¿Estás seguro de que deseas eliminar el rol <strong>{{ rolAEliminar.nombrerol }}</strong>?
        Esta acción no se puede deshacer.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" (click)="confirmarEliminar()">Eliminar</button>
      </div>
    </div>
  </div>
</div>
