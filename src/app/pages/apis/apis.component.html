<div class="container my-5">

  <h2 class="mb-4">Gestión de Apis</h2>

  <form (ngSubmit)="guardarApi()" class="form-row mb-5">

    <div class="form-group col-md-4">
      <label>Path</label>
      <input type="text" class="form-control" [(ngModel)]="nuevaApi.path" name="path" placeholder="/productos/Guardar" required>
    </div>

    <div class="form-group col-md-2">
      <label>Método</label>
      <select class="form-control" [(ngModel)]="nuevaApi.metodo" name="metodo" required>
        <option value="">Seleccione</option>
        <option value="get">get</option>
        <option value="post">post</option>
        <option value="put">put</option>
        <option value="delete">delete</option>
      </select>
    </div>

    <div class="form-group col-md-4">
      <label>Descripción</label>
      <input type="text" class="form-control" [(ngModel)]="nuevaApi.descripcion" name="descripcion">
    </div>

    <div class="form-group col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-danger w-100">
        {{ editando ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>

  </form>

  <h3 class="mb-3">Listado de Apis</h3>

  <table class="table table-striped table-bordered">
    <thead class="thead-dark">
      <tr>
        <th>Path</th>
        <th>Método</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let api of apis">
        <td>{{ api.path }}</td>
        <td>{{ api.metodo }}</td>
        <td>{{ api.descripcion }}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary mr-2" (click)="editarApi(api)">Editar</button>
          <button class="btn btn-sm btn-outline-danger" (click)="abrirModalEliminar(api)">Eliminar</button>
        </td>
      </tr>
      <tr *ngIf="apis.length === 0">
        <td colspan="4" class="text-center">No hay apis registradas</td>
      </tr>
    </tbody>
  </table>

</div>

<!-- Modal de confirmación -->
<div class="modal fade" id="modalEliminarApi" tabindex="-1" role="dialog" aria-labelledby="modalEliminarApiLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalEliminarApiLabel">Confirmar eliminación</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" *ngIf="apiAEliminar">
        ¿Estás seguro de que deseas eliminar la api <strong>{{ apiAEliminar.path }}</strong>?
        Esta acción no se puede deshacer.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" (click)="confirmarEliminar()">Eliminar</button>
      </div>
    </div>
  </div>
</div>
