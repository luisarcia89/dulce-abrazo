<div class="container my-5" style="max-width: 400px;">

  <h2 class="mb-4 text-center">Crear Cuenta</h2>

  <form (ngSubmit)="registrar()">

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" class="form-control" [(ngModel)]="nuevoUsuario.nombre" name="nombre" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="nuevoUsuario.email" name="email" required>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" class="form-control" [(ngModel)]="nuevoUsuario.password" name="password" required>
    </div>

    <button type="submit" class="btn btn-danger w-100 mt-3">Registrarme</button>

  </form>

  <p class="text-center mt-3">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
  </p>

</div>
