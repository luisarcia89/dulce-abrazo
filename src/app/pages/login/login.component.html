<div class="container my-5" style="max-width: 400px;">

  <h2 class="mb-4 text-center">Iniciar Sesión</h2>

  <form (ngSubmit)="iniciarSesion()">

    <div class="form-group">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="credenciales.email" name="email" required>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" class="form-control" [(ngModel)]="credenciales.password" name="password" required>
    </div>

    <button type="submit" class="btn btn-danger w-100 mt-3">Ingresar</button>

  </form>

  <p class="text-center mt-3">
    <a routerLink="/olvide-password">¿Olvidaste tu contraseña?</a>
  </p>

  <p class="text-center">
    ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
  </p>

</div>
