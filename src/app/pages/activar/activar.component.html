<div class="container my-5" style="max-width: 400px;">

  <h2 class="mb-4 text-center">Activar Cuenta</h2>

  <p class="text-center text-muted">
    Ingresa el código de activación que enviamos a tu correo.
  </p>

  <form (ngSubmit)="activar()">

    <div class="form-group">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="datos.email" name="email" required>
    </div>

    <div class="form-group">
      <label>Código de activación</label>
      <input type="text" class="form-control" [(ngModel)]="datos.codigo" name="codigo" required>
    </div>

    <button type="submit" class="btn btn-danger w-100 mt-3">Activar Cuenta</button>

  </form>

  <p class="text-center mt-3">
    <a routerLink="/login">Volver al inicio de sesión</a>
  </p>

</div>
