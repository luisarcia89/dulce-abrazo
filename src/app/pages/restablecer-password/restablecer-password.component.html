<div class="container my-5" style="max-width: 400px;">

  <h2 class="mb-4 text-center">Restablecer Contraseña</h2>

  <p class="text-center text-muted">
    Ingresa el código que recibiste por correo y tu nueva contraseña.
  </p>

  <form (ngSubmit)="restablecer()">

    <div class="form-group">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="datos.email" name="email" required>
    </div>

    <div class="form-group">
      <label>Código de recuperación</label>
      <input type="text" class="form-control" [(ngModel)]="datos.codigo" name="codigo" required>
    </div>

    <div class="form-group">
      <label>Nueva contraseña</label>
      <input type="password" class="form-control" [(ngModel)]="datos.password" name="password" required>
    </div>

    <button type="submit" class="btn btn-danger w-100 mt-3">Restablecer Contraseña</button>

  </form>

  <p class="text-center mt-3">
    <a routerLink="/login">Volver al inicio de sesión</a>
  </p>

</div>
