<div class="container my-5">

  <h2 class="mb-4">Gestión de Productos</h2>


  <form (ngSubmit)="guardarProducto()" class="form-row mb-5">

    <div class="form-group col-md-3">
      <label>Nombre</label>
      <input type="text" class="form-control" [(ngModel)]="nuevoProducto.nombre" name="nombre" required>
    </div>

    <div class="form-group col-md-3">
      <label>Descripción</label>
      <input type="text" class="form-control" [(ngModel)]="nuevoProducto.descripcion" name="descripcion" required>
    </div>

    <div class="form-group col-md-2">
      <label>Precio</label>
      <input type="number" class="form-control" [(ngModel)]="nuevoProducto.precio" name="precio" required>
    </div>

    <div class="form-group col-md-2">
  <label>Cant. Stock</label>
  <input type="number" class="form-control" [(ngModel)]="nuevoProducto.cantidadStock" name="cantidadStock" required>
</div>

    <div class="form-group col-md-2">
      <label>Categoría</label>
      <select class="form-control" [(ngModel)]="nuevoProducto.categoria" name="categoria" required>
        <option value="">Seleccione</option>
        <option value="Tortas">Tortas</option>
        <option value="Cheesecakes">Cheesecakes</option>
        <option value="Galletas">Galletas</option>
        <option value="Otros">Otros</option>
      </select>
    </div>

    <div class="form-group col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-danger w-100">Guardar</button>
    </div>

  </form>


  <h3 class="mb-3">Listado de Productos</h3>

  <table class="table table-striped table-bordered">
    <thead class="thead-dark">
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Categoría</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let producto of productos">
  <td>{{ producto.nombre }}</td>
  <td>{{ producto.descripcion }}</td>
  <td>${{ producto.precio | number:'1.0-0' }}</td>
  <td>{{ producto.categoria }}</td>
  <td>{{ producto.cantidadStock }}</td>
</tr>
      <tr *ngIf="productos.length === 0">
        <td colspan="5" class="text-center">No hay productos registrados</td>
      </tr>
    </tbody>
  </table>

</div>
